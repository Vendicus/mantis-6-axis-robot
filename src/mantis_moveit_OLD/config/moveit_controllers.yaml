moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

controller_names:
  - arm_controller
  - gripper_controller

arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: True
  joints:
    - joint_1_up_base_to_base
    - joint_2_arm1_to_up_base
    - joint_3_arm2_to_arm1
    - joint_4_wrist_to_arm2
    - joint_5_gripper_wrist_to_wrist_link
    - joint_6_gripper_hand_to_gripper_wrist

gripper_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: False
  joints:
    - joint_7_gripper_sprocket_to_gripper_main
    # - joint_mimic_gripper_sprocket_right_to_sprocket_servo
    # - joint_mimic_gripper_sprocket_left_to_sprocket_servo
    # - joint_mimic_gripper_finger1_to_gripper_main
    # - joint_mimic_gripper_finger2_to_gripper_main
    # - joint_mimic_gripper_finger3_to_gripper_main
    # - joint_mimic_gripper_finger4_to_gripper_main
    # - joint_mimic_gripper_left_down_teeth_to_gripper_main
    # - joint_mimic_gripper_right_down_teeth_to_gripper_main
